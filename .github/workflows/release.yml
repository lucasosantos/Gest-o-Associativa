name: Release

# Dispara ao empurrar uma tag "v*" (ex.: v1.0.0). Builda o instalador do
# Windows (.msi/.exe) e do Linux (.AppImage/.deb) e publica os dois como
# assets de uma GitHub Release — os links de download do README apontam
# para essa página de releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar dependências do frontend
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Gestão Associativa ${{ github.ref_name }}"
          releaseBody: "Instaladores para Windows e Linux. Veja o README para instruções de instalação."
          releaseDraft: true
          prerelease: false
